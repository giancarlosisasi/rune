[package]
name = "rune-testkit"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
# A test fixture. It is built by the workspace and spawned by the test suites; it is
# never shipped.
publish = false

[[bin]]
name = "rune-testkit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# For one question only: has a process id gone? Asking rune's own primitive keeps the
# fixture and the code under test agreeing about what "already exited" means.
rune-exec = { path = "../rune-exec" }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
