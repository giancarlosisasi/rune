name: benchmark

# Gate G8. Called by `ci` on every pull request, so a regression is caught where it is
# introduced, and by `release` before anything is published, so nothing ships over budget.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  warm-run:
    name: warm run within budget
    # One machine class, always, so the number means the same thing release over release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: hyperfine

      # The claim is about the shipped binary, so the shipped profile is what is measured.
      - run: cargo build --release --bin rune

      - run: node npm/scripts/benchmark.js target/release/rune
