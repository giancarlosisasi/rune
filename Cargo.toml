[workspace]
members = ["./crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
homepage = "https://github.com/giancarlosisasi/rune"
license = "MIT"
repository = "https://github.com/giancarlosisasi/rune"


[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
rustc-hash = "2"
rquickjs = { version = "0.12", features = ["loader"] }
# All oxc crates in one repo must move together; `=` keeps a patch bump from
# splitting them. Bump with: cargo upgrade --package oxc --exclude-locked
oxc = { version = "=0.138.0", features = ["semantic", "transformer", "codegen", "ast_visit"] }
# Same repository as oxc, its own version line. The oxc facade does not re-export it,
# and stack remapping needs the type, so it is pinned here and bumped with oxc.
oxc_sourcemap = "=8.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Quoting, escapes, comments and multi-line values in dotenv files. The iterator API is
# the one rune uses: a whole-file load would mutate rune's own process environment, and
# every assignment has to be inspected before it is applied.
dotenvy = "0.15"
blake3 = "1"
dunce = "1"
strsim = "0.11"
# Style codes as values rather than as strings written by hand. No I/O and no globals,
# which is what lets the color level be an argument the tests control.
anstyle = "1"
# A port of node's `supports-color`, so the level rune detects is spelled the same way as
# the `FORCE_COLOR` value a JavaScript tool reads.
supports-color = "3"

# Waiting on many children and many pipes at once. Only the drivers rune actually uses:
# no `rt-multi-thread`, because every future here runs on one thread and borrows the
# run's data, and no `net`, because rune opens no sockets.
tokio = { version = "1", features = [
  "rt",
  "process",
  "io-util",
  "time",
  "macros",
  "sync",
] }
# `FuturesUnordered`, for awaiting whichever group member finishes next. Tokio's own
# `JoinSet` needs `'static` tasks, which borrowed run data cannot be.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Platform primitives for process control. `nix` covers setpgid/killpg and sigaction;
# `windows-sys` covers Job Objects and console control events.
nix = { version = "0.31", features = ["fs", "process", "signal"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

insta = "1"
tempfile = "3"
unindent = "0.2"
regex = "1"
portable-pty = "0.9"

[workspace.lints]

[workspace.lints.clippy]
# Groups get priority -1 so the specific rules below can override them.
# https://doc.rust-lang.org/stable/cargo/reference/manifest.html#the-lints-section

# --- pedantic: the whole group, as an error
pedantic = { level = "deny", priority = -1 }
# Naming is hard; these nag without adding clarity.
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

# --- restriction: opt-in prohibitions, picked one by one (never enable the group).
dbg_macro = "deny"        # no leftover dbg!() in committed code
todo = "deny"             # no leftover todo!()
unimplemented = "deny"
print_stdout = "deny"     # user-facing output must go through rune-out, not raw println!
print_stderr = "deny"
allow_attributes = "deny" # prefer #[expect(...)] — it errors when it stops being needed
clone_on_ref_ptr = "deny" # be explicit: Rc::clone(&x), not x.clone()
exit = "deny"             # no std::process::exit — return an ExitCode from main instead
get_unwrap = "deny"       # use indexing or handle the Option, not .get(i).unwrap()
unused_result_ok = "deny"

[profile.dev]
# Line tables give readable backtraces; full debug info is slower to build.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"