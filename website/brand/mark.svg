<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The runic letter raido, cut as one continuous stroke: stave, arm, return, leg.
       Splitting it into four paths leaves a square cap at every join, which shows as a
       spur above 64 px. currentColor is what lets one drawing serve every surface. -->
  <path d="M10 28 V4 L21 9.5 L10 16 L22 28"
        fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/>
</svg>
